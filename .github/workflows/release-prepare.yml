name: Prepare Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Semantic version bump (auto, patch, minor, major)
        required: true
        default: auto
        type: choice
        options:
          - auto
          - patch
          - minor
          - major
      push:
        description: Push commit and tag to origin
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install git-cliff
        uses: taiki-e/install-action@v2
        with:
          tool: git-cliff@2.13.1

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Prepare release
        working-directory: cheese-wails
        run: |
          args=(prepare --bump "${{ inputs.bump }}")
          if [[ "${{ inputs.push }}" == "true" ]]; then
            args+=(--push)
          fi
          ./scripts/release-prepare.sh "${args[@]}"
