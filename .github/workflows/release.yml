name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      republish:
        description: Rebuild and replace the assets of a release whose tag already exists
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.pick.outputs.version }}
      tag: ${{ steps.pick.outputs.tag }}
      file_version: ${{ steps.pick.outputs.file_version }}
    steps:
      - uses: actions/checkout@v4

      - name: Pick the tag
        id: pick
        run: |
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)"
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            [[ "v$version" == "$GITHUB_REF_NAME" ]] || { echo "tag $GITHUB_REF_NAME does not match version $version" >&2; exit 1; }
          elif [[ "${{ inputs.republish }}" != "true" ]] && git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then
            echo "v$version already exists; bump the version in Cargo.toml first" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          # GitHub turns ~ into . in asset names, so the notes and checksums use the uploaded names.
          echo "file_version=$(echo "$version" | sed "s/-/./")" >> "$GITHUB_OUTPUT"

  portable:
    needs: version
    uses: ./.github/workflows/portable.yml

  release:
    needs: [version, portable]
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.version.outputs.version }}
      TAG: ${{ needs.version.outputs.tag }}
      FILE_VERSION: ${{ needs.version.outputs.file_version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: kiekje-*
          path: dist
          merge-multiple: true

      - name: Write the checksums
        run: |
          shopt -s nullglob
          for file in dist/*~*; do mv "$file" "${file//\~/.}"; done
          (cd dist && sha256sum kiekje* > SHA256SUMS && cat SHA256SUMS)
          echo "TITLE=kiekje $VERSION" >> "$GITHUB_ENV"

      - name: Write the notes
        run: |
          {
            if [[ -f "docs/releases/$VERSION.md" ]]; then
              cat "docs/releases/$VERSION.md"
            else
              git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
              git tag -l --format='%(contents)' "$TAG"
            fi
            echo
            echo "## Install"
            echo
            echo "Needs GTK 4.16 or newer. gtk4-layer-shell is built in. On GTK 4.14 (Ubuntu 24.04, Mint 22) it starts but the stylesheet does not load."
            echo
            echo '```'
            echo "Ubuntu, Debian, Mint:  sudo apt install ./kiekje_${FILE_VERSION}-1_amd64.deb"
            echo "Fedora:                sudo dnf install ./kiekje-${FILE_VERSION}-1.x86_64.rpm"
            echo "openSUSE:              sudo zypper install --allow-unsigned-rpm ./kiekje-${FILE_VERSION}-1.x86_64.rpm"
            echo "Arch:                  the kiekje-bin PKGBUILD attached below"
            echo "Other:                 tar -xzf kiekje-$VERSION-x86_64-linux.tar.gz && sudo kiekje-$VERSION-x86_64-linux/packaging/install.sh kiekje-$VERSION-x86_64-linux/kiekje"
            echo '```'
            echo
            echo "ARM: the same files with \`arm64\` or \`aarch64\` in the name."
          } > dist/notes.md

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: ${{ env.TITLE }}
          body_path: dist/notes.md
          prerelease: ${{ contains(env.TAG, '-') }}
          files: |
            dist/kiekje*
            dist/SHA256SUMS

      - name: Attach the AUR PKGBUILDs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          archive="https://github.com/$GITHUB_REPOSITORY/archive/refs/tags/$TAG.tar.gz"
          if ! curl -fsSL --retry 3 --retry-delay 10 --retry-all-errors \
              -H "Authorization: Bearer $GH_TOKEN" -o /tmp/source.tar.gz "$archive"; then
            echo "::warning::$archive is not downloadable; the kiekje PKGBUILD checksum comes from git archive"
            git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
            git archive --format=tar.gz --prefix="kiekje-$VERSION/" -o /tmp/source.tar.gz "$TAG"
          fi
          packaging/aur/bump.sh "$VERSION" /tmp/aur /tmp/source.tar.gz \
            "dist/kiekje-$VERSION-x86_64-linux.tar.gz" "dist/kiekje-$VERSION-aarch64-linux.tar.gz"
          cp /tmp/aur/kiekje/PKGBUILD dist/PKGBUILD-kiekje
          cp /tmp/aur/kiekje-bin/PKGBUILD dist/PKGBUILD-kiekje-bin
          gh release upload "$TAG" dist/PKGBUILD-kiekje dist/PKGBUILD-kiekje-bin --clobber
