name: Publish Release

on:
  push:
    tags:
      - "v[0-9]*"

permissions:
  contents: write

env:
  APP_DIR: cheese-wails

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install git-cliff
        uses: taiki-e/install-action@v2
        with:
          tool: git-cliff@2.13.1

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: ${{ env.APP_DIR }}/go.mod
          cache-dependency-path: ${{ env.APP_DIR }}/go.sum

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ env.APP_DIR }}/frontend/package-lock.json

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            build-essential \
            pkg-config

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

      - name: Build release artifacts
        working-directory: ${{ env.APP_DIR }}
        run: ./kiekje.sh ship

      - name: Generate release notes
        id: notes
        run: |
          git-cliff \
            --config "${{ env.APP_DIR }}/cliff.toml" \
            --include-path cheese-wails/ \
            --current \
            --strip header \
            --output release-notes.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Kiekje ${{ github.ref_name }}
          body_path: release-notes.md
          files: |
            ${{ env.APP_DIR }}/dist/kiekje-linux-amd64.tar.gz
          generate_release_notes: false
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
