name: Bug report
description: Something does not work as expected.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what happened instead.
    validations:
      required: true
  - type: input
    id: desktop
    attributes:
      label: Desktop
      placeholder: KDE Plasma 6.4 Wayland, Hyprland 0.50, GNOME 48
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Kiekje version and install method
      placeholder: 0.1.0-alpha.5 from the .deb
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: kiekje doctor
      description: Paste the output of `kiekje doctor`.
      render: text
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log
      description: Output of `kiekje daemon` run from a terminal while the bug happens.
      render: text
