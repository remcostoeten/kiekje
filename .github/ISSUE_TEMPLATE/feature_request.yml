name: Feature request
description: Suggest something Kiekje should do.
labels: [enhancement]
body:
  - type: textarea
    id: what
    attributes:
      label: What you want to do
      description: The task you are trying to get done and where Kiekje gets in the way.
    validations:
      required: true
  - type: input
    id: desktop
    attributes:
      label: Desktop
      placeholder: KDE Plasma 6.4 Wayland
