<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kiekje social preview</title>
<style>
@font-face {
  font-family: "Geist";
  src: url("../../../resources/fonts/Geist-Variable.ttf") format("truetype");
  font-weight: 100 900;
}
@font-face {
  font-family: "Geist Mono";
  src: url("fonts/GeistPixel-Square.ttf") format("truetype");
  font-weight: 100 900;
}
:root {
  --bg: #040404;
  --wall: #0c0c0c;
  --raised: #101010;
  --raised-hi: #161616;
  --stroke: #1c1c1c;
  --stroke-hi: #262626;
  --heading: #ebebeb;
  --fg: #d3d3d3;
  --ink: #c6c6c6;
  --faint: #7b7b7b;
  --accent: #fe5101;
  --accent-text: #ff8a52;
}
html, body {
  width: 1280px;
  height: 640px;
  margin: 0;
  overflow: hidden;
  background: var(--bg);
}
body {
  position: relative;
  font-family: "Geist", sans-serif;
  color: var(--fg);
  -webkit-font-smoothing: antialiased;
}
.desk {
  position: absolute;
  inset: 0;
  background-color: var(--wall);
  background-image: radial-gradient(circle at 1px 1px, #1d1d1d 1px, transparent 1.4px);
  background-size: 24px 24px;
}
.win {
  position: absolute;
  background: #0a0a0a;
  border: 1px solid var(--stroke-hi);
  border-radius: 10px;
  overflow: hidden;
}
.bar {
  height: 34px;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 0 14px;
  border-bottom: 1px solid var(--stroke);
  background: var(--raised);
  font-size: 13px;
  color: var(--faint);
}
.dots { display: flex; gap: 6px; margin-right: 6px; }
.dots i { width: 10px; height: 10px; border-radius: 50%; background: #2a2a2a; display: block; }
.gallery { left: 846px; top: 64px; width: 470px; height: 360px; }
.grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  padding: 16px;
}
.shot {
  height: 84px;
  border-radius: 6px;
  border: 1px solid var(--stroke);
  background: linear-gradient(160deg, #262626, #141414 70%);
  position: relative;
}
.shot::after {
  content: "";
  position: absolute;
  left: 10px; right: 10px; bottom: -18px;
  height: 6px;
  border-radius: 3px;
  background: #1f1f1f;
}
.grid .shot { margin-bottom: 18px; }
.shot.b { background: linear-gradient(200deg, #2e2e2e, #121212 65%); }
.shot.c { background: linear-gradient(120deg, #1a1a1a, #303030); }
.shot.d { background: linear-gradient(90deg, #121212 40%, #262626 40%, #262626 42%, #181818 42%); }
.term { left: 700px; top: 352px; width: 470px; height: 178px; }
.lines { padding: 18px 20px; display: grid; gap: 13px; }
.lines span { display: block; height: 8px; border-radius: 4px; background: #262626; }
.dim {
  position: absolute;
  left: 92px;
  top: 88px;
  width: 704px;
  height: 420px;
  box-shadow: 0 0 0 1600px rgba(0, 0, 0, 0.7);
}
.sel {
  position: absolute;
  left: 92px;
  top: 88px;
  width: 704px;
  height: 420px;
  box-sizing: border-box;
  border: 2px solid var(--accent);
}
.h {
  position: absolute;
  width: 11px;
  height: 11px;
  background: var(--accent);
  border: 2px solid #040404;
  border-radius: 2px;
}
.h.tl { left: -8.5px; top: -8.5px; }
.h.tr { right: -8.5px; top: -8.5px; }
.h.bl { left: -8.5px; bottom: -8.5px; }
.h.br { right: -8.5px; bottom: -8.5px; }
.readout {
  position: absolute;
  left: 92px;
  top: 46px;
  height: 30px;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 0 12px;
  border-radius: 6px;
  background: #141414;
  border: 1px solid var(--stroke-hi);
  font-size: 16px;
  font-weight: 500;
  color: var(--heading);
  font-variant-numeric: tabular-nums;
  font-family: "Geist Mono", monospace;
}
.readout b { color: var(--faint); font-weight: 400; }
.content {
  position: absolute;
  left: 92px;
  top: 88px;
  width: 704px;
  height: 420px;
  box-sizing: border-box;
  padding: 74px 56px 0;
}
.brand { display: flex; align-items: center; gap: 22px; }
.brand img { width: 112px; height: 112px; margin-left: -4px; }
.brand h1 {
  margin: 0;
  font-family: "Geist Mono", monospace;
  font-weight: 400;
  letter-spacing: 0;
  font-size: 132px;
  line-height: 1;
  color: var(--heading);
  transform: translateY(-6px);
}
@font-face { font-family: "Tag"; src: url("fonts/InstrumentSerif-Italic.ttf") format("truetype"); font-style: italic; }
.tag {
  margin: 28px 0 0;
  font-family: "Tag", serif;
  font-style: italic;
  font-size: 50px;
  line-height: 1.08;
  font-weight: 400;
  letter-spacing: -0.01em;
  color: var(--heading);
}
.tag .soft { color: #8f8f8f; }
.tag em { font-style: normal; color: var(--accent-text); }
.cursor { position: absolute; left: 790px; top: 502px; }
.meta {
  position: absolute;
  left: 92px;
  right: 64px;
  bottom: 42px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 22px;
  color: #b4b4b4;
}
.meta .repo { font-family: "Geist Mono", monospace; font-size: 22px; color: var(--ink); }
.hints {
  position: absolute;
  left: 860px;
  top: 150px;
  width: 340px;
  padding: 22px 24px;
  border-radius: 10px;
  background: #0f0f0f;
  border: 1px solid #262626;
  display: grid;
  gap: 16px;
}
.hints div { display: flex; align-items: center; gap: 16px; font-size: 22px; color: var(--fg); }
.hints kbd {
  min-width: 34px;
  height: 34px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 0 8px;
  box-sizing: border-box;
  border-radius: 6px;
  background: #1a1a1a;
  border: 1px solid #2e2e2e;
  font-family: "Geist Mono", monospace;
  font-size: 17px;
  color: var(--heading);
}
.hints .on kbd { background: #fe5101; border-color: #fe5101; color: #fff; }
.version {
  position: absolute;
  right: 64px;
  top: 46px;
  height: 30px;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 0 12px;
  border-radius: 6px;
  background: #161616;
  border: 1px solid #2c2c2c;
  font-family: "Geist Mono", monospace;
  font-size: 17px;
  color: var(--heading);
}
.version i { width: 8px; height: 8px; border-radius: 50%; background: #fe5101; }
.os { display: flex; align-items: center; gap: 18px; }
.os svg { width: 28px; height: 28px; display: block; }
.os .now { fill: var(--heading); }
.os .dist { fill: #8a8a8a; }
.os .sep { width: 1px; height: 26px; background: #2c2c2c; }
.os b { margin-left: 6px; font-weight: 450; color: #ff8a52; }
</style>
</head>
