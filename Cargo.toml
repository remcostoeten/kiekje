[package]
name = "kiekje"
version = "0.1.0-alpha.3"
edition = "2024"
license = "MIT"
description = "Capture, mark up and keep screenshots"
repository = "https://github.com/remcostoeten/kiekje"

[dependencies]
async-channel = "2"
fast_image_resize = "6.1.0"
gtk = { version = "0.11", package = "gtk4", features = ["v4_14"] }
gtk4-layer-shell = { version = "0.8", default-features = false }
ksni = { version = "0.3.6", default-features = false, features = ["async-io", "blocking"] }
libc = "0.2.189"
png = "0.18"
rusqlite = { version = "0.37", features = ["bundled"] }
rustix = { version = "1", features = ["event"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smithay-client-toolkit = { version = "0.21", default-features = false }
thiserror = "2"
toml = "1.1.6"
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }

[build-dependencies]
glib-build-tools = "0.22"

[[example]]
name = "lab_probe"
test = true
