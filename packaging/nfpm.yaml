name: kiekje
arch: ${NFPM_ARCH}
platform: linux
version: ${VERSION}
version_schema: semver
release: 1
section: graphics
priority: optional
maintainer: Remco Stoeten <https://github.com/remcostoeten>
description: Capture, mark up and keep screenshots
vendor: Remco Stoeten
homepage: https://github.com/remcostoeten/kiekje
license: MIT AND OFL-1.1

contents:
  - src: ./stage/usr/
    dst: /usr
    type: tree

overrides:
  deb:
    depends:
      - libgtk-4-1 (>= 4.14)
      - libc6 (>= 2.39)
    recommends:
      - xdg-desktop-portal
      - libgtk-4-media-gstreamer
      - gstreamer1.0-plugins-base
      - gstreamer1.0-plugins-good
  rpm:
    depends:
      - libgtk-4.so.1()(64bit)
      - glibc >= 2.39
    recommends:
      - xdg-desktop-portal
      - gstreamer1-plugins-base
      - gstreamer1-plugins-good
